#------------------------------------------------------------------
# file: /boot/grub/grub.cfg for the Live version of antiX
#
# This file can get updated automatically on a LiveUSB via the save
# feature in the text menus.  It is possible to break these updates
# by editing this file.
#------------------------------------------------------------------

# search --no-floppy --set=root --fs-uuid %UUID%
set timeout=-1
set gfxmode=1024x768
#set gfxpayload="3200x1800;2560x1440;2160x1440;1920x1080;1600x1200;1600x1050;1600x900;1440x900;1366x768;1280x1024;1280x800;1280x720;1024x768;auto"
set gfxpayload="2048x2048;2048x1280;2048x1080;1920x1080;1600x900;1600x1200;1600x1050;1500x1000;1440x960;1440x900;1368x912;1366x768;1280x800;1280x720;1280x1024;1200x800;1024x768;auto"

# load defaults
#
if [ -s $prefix/config/defaults.cfg ]; then
source $prefix/config/defaults.cfg
fi


set default=1

menuentry " antiX-19.2-4.19 kernel-runit x64-base (6 April 2020)" {
linux /antiX/vmlinuz disable=lxF
initrd /antiX/initrd.gz
}

menuentry "Start clean Linux without disable-lxF line. [EXPEREMENTAL]" {
linux /antiX/vmlinuz 
initrd /antiX/initrd.gz 
}

menuentry "Lunatical antiX 19.2 x64 (29 June 2026)" {
linux /antiX/vmlinuz disable=lxF tz=Europe/Kiev desktheme=dark lang=ru_RU conwidth=114 toram pcie_aspm=off intel_pstate=disable video=eDP-1:d 
initrd /antiX/initrd.gz
}

menuentry " antiX-19.2-4.19 kernel-runit x64-base Customize Boot (text menus)" {
linux /antiX/vmlinuz disable=lxF tz=Europe/Minsk desktheme=dark lang=en_US conwidth=110 toram menus
initrd /antiX/initrd.gz
}

submenu ">>> Advanced Options for antiX-19.2-4.19 kernel-runit x64-base <<<" {

menu_color_normal=white/black
menu_color_highlight=violet/light-gray

menuentry " antiX-19.2-4.19 kernel-runit x64-base Failsafe" {
linux /antiX/vmlinuz disable=lxF failsafe
initrd /antiX/initrd.gz
}

menuentry "antiX-19.2-4.19 kernel-runit x64-base Create Bootchart" {
linux /antiX/vmlinuz disable=lxF bootchart initcall_debug printk.time=y
initrd /antiX/initrd.gz
}

menuentry " antiX-19.2-4.19 kernel-runit x64-base (1024x768)" {
linux /antiX/vmlinuz disable=lxF
initrd /antiX/initrd.gz
}

menuentry " Turn off" --hotkey=P {
halt
}

menuentry " Reboot"  --hotkey=R {
reboot
}

if [ -f /boot/grub/theme/help.txt ]; then
menuentry " Help" --hotkey=H {
cat /boot/grub/theme/help.txt
echo -n "Press <Enter> to continue "
read xxx_help
}
fi
}

# load boot menus
#
if [  -f  $prefix/config/bootmenu.cfg ]; then
source $prefix/config/bootmenu.cfg
fi

