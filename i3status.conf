# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 3
}

order += "disk /"
order += "ethernet _first_"
order += "battery all"
order += "cpu_usage"
order += "tztime local"
order += "cpu_temperature 0"

ethernet _first_ {
        # if you use %speed, i3status requires root privileges
        format_up = "Интернет: Есть [McLaut %speed]"
        format_down = "Интернет: Отключен [Проверь кабель или роутер]"
}

battery all {
        format = "Батарея: %percentage %status"
}

tztime local {
        format = "%Y-%m-%d %H:%M:%S"
}

cpu_usage {
        format = "CPU: %usage || Cores: %cpu0 %cpu1 %cpu2 %cpu3"
}

disk "/" {
        format = "RAM: %avail"
}

cpu_temperature 0 {
        format = "Темп.Процессора: %degrees °C"
        path = "/sys/class/thermal/thermal_zone3/temp"
        
}

